    function dongChat() {
      try {
        window.parent.postMessage({
          type: 'CLOSE_ADMISSIONS_CHAT'
        }, '*');
      } catch (e) {}
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';
      processBotResponse(text);
    }

    function sendQuickMessage(text) {
      appendMessage(text, 'user');
      processBotResponse(text);
    }

    let currentTypingTimer = null;
    let currentTypingResolve = null;

    function stopCurrentTyping() {
      if (currentTypingTimer) {
        clearTimeout(currentTypingTimer);
        currentTypingTimer = null;
      }
      if (currentTypingResolve) {
        currentTypingResolve();
        currentTypingResolve = null;
      }
    }

    function showTypingIndicator() {
      removeTypingIndicator();
      const messagesContainer = document.getElementById('chat-messages');
      if (!messagesContainer) return;
      const indicator = document.createElement('div');
      indicator.id = 'bot-typing-indicator';
      indicator.className = 'flex items-start space-x-2';
      indicator.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-indigo-100 flex items-center justify-center text-sm shrink-0 shadow-sm">
          👩‍💼
        </div>
        <div class="bg-white px-3.5 py-3 rounded-2xl rounded-tl-none shadow-sm text-gray-400 border border-gray-100 flex items-center space-x-1.5">
          <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
          <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
          <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full animate-bounce" style="animation-delay: 300ms"></span>

    function typeWriterEffect(container, html, scrollContainer) {
      let i = 0;
      const len = html.length;
      const stepSize = len > 500 ? 5 : (len > 250 ? 3 : 2);
      const speed = 10;

      currentTypingResolve = () => {
        container.innerHTML = html;
        if (scrollContainer) scrollContainer.scrollTop = scrollContainer.scrollHeight;
      };

      function step() {
        if (i < len) {
          if (html[i] === '<') {
            const closeTag = html.indexOf('>', i);
            i = (closeTag !== -1) ? closeTag + 1 : i + 1;
          } else if (html[i] === '&') {
            const closeEntity = html.indexOf(';', i);
            i = (closeEntity !== -1 && closeEntity - i < 10) ? closeEntity + 1 : i + 1;
          } else {
            i += stepSize;
            if (i > len) i = len;
          }

          container.innerHTML = html.substring(0, i) + '<span class="inline-block w-1.5 h-3.5 bg-indigo-500 animate-pulse ml-0.5 align-middle"></span>';
          if (scrollContainer) scrollContainer.scrollTop = scrollContainer.scrollHeight;
          currentTypingTimer = setTimeout(step, speed);
        } else {
          container.innerHTML = html;
          currentTypingTimer = null;
          currentTypingResolve = null;
          if (scrollContainer) scrollContainer.scrollTop = scrollContainer.scrollHeight;
        }
      }

      step();
    }

    // === CHUẨN HÓA TIẾNG VIỆT & XỬ LÝ LỖI GÕ PHÍM / KHÔNG DẤU / SAI DẤU ===
    function removeVietnameseTones(str) {
      if (!str) return '';
      let s = str.toLowerCase();
      s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      s = s.replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g, "a");
      s = s.replace(/[èéẹẻẽêềếệểễ]/g, "e");
      s = s.replace(/[ìíịỉĩ]/g, "i");
      s = s.replace(/[òóọỏõôồốộổỗơờớợởỡ]/g, "o");
      s = s.replace(/[ùúụủũưừứựửữ]/g, "u");
      s = s.replace(/[ỳýỵỷỹ]/g, "y");
      s = s.replace(/[đĐ]/g, "d");
      return s.trim();
    }

    function levenshtein(a, b) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

      submitBtn.innerText = 'Đang gửi...';

      const formData = new URLSearchParams();
      formData.append('name', name);
      formData.append('phone', phone);
      formData.append('major', major);

      try {
        await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: formData
        });

        event.target.innerHTML = `
          <div class="text-center py-2 text-emerald-600 font-medium text-xs">
            ✅ <b>Đã ghi nhận yêu cầu tư vấn!</b><br>
            Cán bộ tuyển sinh sẽ gọi qua SĐT <b>${phone}</b> sớm nhất.
          </div>
        `;
      } catch (error) {
        alert('Có lỗi kết nối, vui lòng thử lại!');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Gửi Thông Tin Hẹn Gọi';
      }
    };
  </script>
</body>
</html>
