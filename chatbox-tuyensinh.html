<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tư Vấn & Tuyển Sinh Trực Tuyến</title>
  <!-- Thư viện Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0 overflow-hidden font-sans w-screen h-screen flex flex-col bg-white">
  <!-- ================= BẮT ĐẦU GIAO DIỆN CHATBOX ================= -->
  <div id="chat-box" class="w-full h-full bg-white flex flex-col overflow-hidden">
      
      <!-- Tiêu đề Chatbox -->
      <div class="bg-indigo-600 text-white px-4 py-3 flex items-center justify-between shadow">
        <div class="flex items-center space-x-3">
          <div class="relative">
            <div class="w-9 h-9 rounded-full bg-indigo-50 flex items-center justify-center text-xl shadow-inner">
              👩‍💼
            </div>
            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-400 border-2 border-white rounded-full"></span>
          </div>
          <div>
            <h3 class="font-semibold text-sm">Cán Bộ Tư Vấn</h3>
            <p class="text-[11px] text-indigo-200">Hỗ trợ trực tuyến 24/7</p>
          </div>
        </div>
        <button onclick="dongChat()" class="text-white hover:text-gray-200 p-1" title="Đóng chat">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Vùng tin nhắn -->
      <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50 text-xs">
        <!-- Lời chào đầu tiên -->
        <div class="flex items-start space-x-2">
          <div class="w-7 h-7 rounded-full bg-indigo-100 flex items-center justify-center text-sm shrink-0 shadow-sm">
            👩‍💼
          </div>
          <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm text-gray-800 max-w-[85%] border border-gray-100 leading-relaxed">
            Xin chào! Em có thể chọn nhanh các danh mục dưới đây hoặc nhập câu hỏi trực tiếp:
          </div>
        </div>

        <!-- MENU DANH MỤC TIỆN ÍCH -->
        <div id="quick-options" class="grid grid-cols-2 gap-2 pt-1">
          <!-- 1. Link Cổng Đăng Ký Online -->
          <a href="https://tuyensinh.dtntag.edu.vn/tuyen-sinh" target="_blank" rel="noopener noreferrer" 
             class="bg-indigo-50 border border-indigo-200 text-indigo-700 px-2.5 py-2 rounded-xl hover:bg-indigo-100 transition flex flex-col justify-between">
            <span class="font-bold">📝 Đăng ký Online ↗</span>
            <span class="text-[10px] text-gray-500 mt-0.5">Cổng tuyển sinh trực tuyến</span>
          </a>

          <!-- 2. Link Sổ Tay Nghề Flipbook -->
          <a href="https://heyzine.com/flip-book/cb1c57e308.html" target="_blank" rel="noopener noreferrer" 
             class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-2.5 py-2 rounded-xl hover:bg-emerald-100 transition flex flex-col justify-between">
            <span class="font-bold">📖 Sổ tay các nghề ↗</span>
            <span class="text-[10px] text-gray-500 mt-0.5">Xem sách lật thông tin nghề</span>
          </a>

          <!-- 3. Form Đăng ký tư vấn nhanh qua Sheet -->
          <button onclick="sendQuickMessage('Nhận tư vấn nhanh')" 
                  class="bg-indigo-50 border border-indigo-200 text-indigo-700 px-2.5 py-2 rounded-xl text-left hover:bg-indigo-100 transition">
            <span class="font-bold">📞 Hẹn gọi tư vấn</span>
            <span class="text-[10px] text-gray-500 block mt-0.5">Để lại SĐT cán bộ gọi lại</span>
          </button>

          <!-- 4. Chính sách & Hỗ trợ -->
          <button onclick="sendQuickMessage('Chính sách và hỗ trợ')" 
                  class="bg-indigo-50 border border-indigo-200 text-indigo-700 px-2.5 py-2 rounded-xl text-left hover:bg-indigo-100 transition">
            <span class="font-bold">💰 Chính sách & Hỗ trợ</span>
            <span class="text-[10px] text-gray-500 block mt-0.5">Miễn học phí, KTX & trợ cấp</span>
          </button>
        </div>
      </div>

      <!-- Khung nhập câu hỏi -->
      <div class="p-2.5 bg-white border-t border-gray-100 flex items-center space-x-2">
        <input id="chat-input" type="text" placeholder="Nhập câu hỏi cần tư vấn..." 
               onkeydown="if(event.key==='Enter') sendMessage()" 
               class="flex-1 px-3 py-2 border border-gray-200 rounded-full text-xs focus:outline-none focus:border-indigo-500">
        <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-full shadow">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </button>
      </div>

    </div>
  </div>
  <!-- ================= KẾT THÚC GIAO DIỆN CHATBOX ================= -->

  <!-- ================= MÃ JAVASCRIPT XỬ LÝ ================= -->
  <script>
    const GOOGLE_SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxZiikLptQw8DRS2vHunU2HbWVjKDwM9ckuxMo2ae6bmEr19RYxpwVNswjliQvpBVrmJA/exec';

    function dongChat() {
      try {
        window.parent.postMessage({
          type: 'CLOSE_ADMISSIONS_CHAT'
        }, '*');
      } catch (e) {}
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';
      processBotResponse(text);
    }

    function sendQuickMessage(text) {
      appendMessage(text, 'user');
      processBotResponse(text);
    }

    function appendMessage(content, sender = 'bot') {
      const messagesContainer = document.getElementById('chat-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = sender === 'user' ? 'flex justify-end' : 'flex items-start space-x-2';

      if (sender === 'user') {
        messageDiv.innerHTML = `
          <div class="bg-indigo-600 text-white p-3 rounded-2xl rounded-tr-none shadow-sm max-w-[80%]">
            ${content}
          </div>
        `;
      } else {
        messageDiv.innerHTML = `
          <div class="w-7 h-7 rounded-full bg-indigo-100 flex items-center justify-center text-sm shrink-0 shadow-sm">
            👩‍💼
          </div>
          <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm text-gray-800 max-w-[85%] border border-gray-100 leading-relaxed">
            ${content}
          </div>
        `;
      }

      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function processBotResponse(query) {
      const q = query.toLowerCase();

      // 1. Phản hồi yêu cầu Đăng ký online
      if (q.includes('đăng ký online') || q.includes('cổng tuyển sinh')) {
        setTimeout(() => {
          appendMessage(`Em có thể nộp hồ sơ xét tuyển trực tiếp trên hệ thống tuyển sinh của nhà trường tại đây nhé:<br><br>
            <a href="https://tuyensinh.dtntag.edu.vn/tuyen-sinh" target="_blank" class="inline-block bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-indigo-700 transition">
              👉 Truy Cập Cổng Đăng Ký Online
            </a>`, 'bot');
        }, 300);
        return;
      }

      // 2. Các ngành, nghề đang đào tạo
      if (q.includes('sổ tay') || q.includes('nghề') || q.includes('ngành') || q.includes('đang đào tạo') || q.includes('học gì')) {
        setTimeout(() => {
          appendMessage(`🎓 <b>CÁC NGÀNH, NGHỀ ĐÀO TẠO</b><br><br>
          Trường đào tạo đa dạng các ngành nghề.<br><br>
          Bấm vào sổ tay để biết các ngành đang đào tạo và xem chi tiết chương trình học tại:<br><br>
          <a href="https://online.dtntag.edu.vn/ChuongTrinhDaoTao" target="_blank" class="inline-block bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-indigo-700 transition">
            👉 Xem Chi Tiết Chương Trình Đào Tạo
          </a><br><br>
          📖 Hoặc mở <a href="https://heyzine.com/flip-book/cb1c57e308.html" target="_blank" class="text-emerald-600 font-semibold underline">Sổ tay các nghề</a> để xem sách lật điện tử.`, 'bot');
        }, 300);
        return;
      }

      // 3. Form để lại thông tin gọi lại (ghi vào Google Sheet)
      if (q.includes('tư vấn') || q.includes('hẹn') || q.includes('liên hệ')) {
        setTimeout(() => {
          const formHTML = `
            <div class="font-semibold text-indigo-700 mb-1">📞 Hẹn Cán Bộ Tư Vấn Gọi Lại</div>
            <p class="text-[11px] text-gray-500 mb-2">Vui lòng để lại số điện thoại, nhà trường sẽ liên hệ ngay:</p>
            <form onsubmit="handleLeadSubmit(event)" class="space-y-2">
              <input id="lead-name" type="text" placeholder="Họ và tên thí sinh *" required class="w-full px-2.5 py-1.5 border rounded text-xs focus:outline-none focus:border-indigo-500">
              <input id="lead-phone" type="tel" placeholder="Số điện thoại / Zalo *" required class="w-full px-2.5 py-1.5 border rounded text-xs focus:outline-none focus:border-indigo-500">
              <select id="lead-major" class="w-full px-2 py-1.5 border rounded text-xs text-gray-600 focus:outline-none focus:border-indigo-500">
                <option value="Hỏi thông tin xét tuyển">Hỏi thông tin xét tuyển</option>
                <option value="Tư vấn chọn nghề">Tư vấn chọn nghề phù hợp</option>
                <option value="Hỏi chính sách nội trú - học phí">Chính sách nội trú & Học bổng</option>
              </select>
              <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-1.5 rounded transition">
                Gửi Thông Tin Hẹn Gọi
              </button>
            </form>
          `;
          appendMessage(formHTML, 'bot');
        }, 300);
        return;
      }

      // 4. Tổng quan Chính sách và hỗ trợ (khi click menu hoặc hỏi chung)
      if (q.includes('chính sách và hỗ trợ') || q.includes('chính sách & hỗ trợ') || q.includes('học phí và nội trú') || q === 'chính sách') {
        setTimeout(() => {
          appendMessage(`<b>🎁 CHÍNH SÁCH VÀ HỖ TRỢ DÀNH CHO HỌC SINH:</b><br><br>
          💰 <b>Học phí:</b> Học sinh tốt nghiệp THCS học trung cấp được <b>miễn hoàn toàn học phí</b> theo quy định của Nhà nước.<br><br>
          🏠 <b>Ký túc xá:</b> Học sinh được bố trí ở <b>ký túc xá miễn phí</b>, đầy đủ tiện nghi sinh hoạt.<br><br>
          🎁 <b>Chính sách hỗ trợ:</b> Học sinh thuộc diện chính sách được hưởng:<br>
          • 🏠 Trợ cấp nội trú hàng tháng<br>
          • 💵 Hỗ trợ chi phí ban đầu<br>
          • 🚌 Hỗ trợ tiền xe.<br><br>
          📖 Chi tiết xem thêm trong <a href="https://heyzine.com/flip-book/cb1c57e308.html" target="_blank" class="text-indigo-600 font-semibold underline">Sổ tay các nghề</a>.`, 'bot');
        }, 300);
        return;
      }

      // 5. Câu hỏi: Miễn phí học phí
      if (q.includes('học phí') || q.includes('tiền học') || q.includes('miễn phí')) {
        setTimeout(() => {
          appendMessage(`💰 <b>CHÍNH SÁCH HỌC PHÍ</b><br><br>
          🎓 Học sinh tốt nghiệp THCS học trung cấp được <b>miễn hoàn toàn học phí</b> theo quy định của Nhà nước.`, 'bot');
        }, 300);
        return;
      }

      // 6. Câu hỏi: Ký túc xá / Nội trú
      if (q.includes('ký túc xá') || q.includes('ktx') || q.includes('ở lại trường') || (q.includes('nội trú') && !q.includes('trợ cấp'))) {
        setTimeout(() => {
          appendMessage(`🏠 <b>KÝ TÚC XÁ - NỘI TRÚ</b><br><br>
          Học sinh được bố trí ở <b>ký túc xá miễn phí</b>, đầy đủ tiện nghi sinh hoạt.`, 'bot');
        }, 300);
        return;
      }

      // 7. Câu hỏi: Chính sách hỗ trợ / Trợ cấp
      if (q.includes('chính sách hỗ trợ') || q.includes('hưởng chính sách') || q.includes('trợ cấp') || q.includes('tiền xe') || q.includes('chi phí ban đầu') || q.includes('hỗ trợ')) {
        setTimeout(() => {
          appendMessage(`🎁 <b>CHÍNH SÁCH HỖ TRỢ</b><br><br>
          Học sinh thuộc diện chính sách được hưởng:<br><br>
          🏠 Trợ cấp nội trú hàng tháng<br>
          💵 Hỗ trợ chi phí ban đầu<br>
          🚌 Hỗ trợ tiền xe.`, 'bot');
        }, 300);
        return;
      }

      // 8. Câu hỏi: Hồ sơ đăng ký tuyển sinh gồm những gì?
      if (q.includes('hồ sơ') || q.includes('giấy tờ') || q.includes('cần chuẩn bị')) {
        setTimeout(() => {
          appendMessage(`📄 <b>HỒ SƠ ĐĂNG KÝ TUYỂN SINH</b><br><br>
          📝 Phiếu đăng ký dự tuyển<br>
          📋 Bản sao giấy khai sinh<br>
          🎓 Bản sao bằng tốt nghiệp<br>
          📸 Ảnh 4×6<br>
          📌 Giấy tờ ưu tiên (nếu có).`, 'bot');
        }, 300);
        return;
      }

      // 9. Câu hỏi: Hình thức tuyển sinh
      if (q.includes('hình thức') || q.includes('xét tuyển') || q.includes('thi tuyển') || q.includes('thi không') || q.includes('có thi')) {
        setTimeout(() => {
          appendMessage(`📋 <b>HÌNH THỨC TUYỂN SINH</b><br><br>
          Nhà trường <b>xét tuyển hồ sơ</b>, không tổ chức thi tuyển.`, 'bot');
        }, 300);
        return;
      }

      // 10. Câu hỏi: Thời gian đào tạo trình độ trung cấp là bao lâu?
      if (q.includes('thời gian đào tạo') || q.includes('thời gian học') || q.includes('bao lâu') || q.includes('mấy năm') || q.includes('mấy tháng')) {
        setTimeout(() => {
          appendMessage(`⏱️ <b>THỜI GIAN ĐÀO TẠO</b><br><br>
          Thời gian đào tạo trình độ trung cấp là <b>2 năm</b> theo chương trình đào tạo hiện hành của Trường.`, 'bot');
        }, 300);
        return;
      }

      // 11. Câu hỏi: Học sinh học tại trường có được thực hành nhiều không?
      if (q.includes('thực hành') || q.includes('thực tập') || q.includes('xưởng') || q.includes('phòng máy')) {
        setTimeout(() => {
          appendMessage(`🔧 <b>HỌC TẬP VÀ THỰC HÀNH</b><br><br>
          Chương trình đào tạo chú trọng thực hành là chủ yếu. Học sinh được học tập tại các xưởng thực hành, phòng máy và các khu vực thực hành nghề nghiệp.`, 'bot');
        }, 300);
        return;
      }

      // 12. Câu hỏi: Học liên thông lên Cao đẳng, Đại học
      if (q.includes('liên thông') || q.includes('học tiếp') || q.includes('cao đẳng') || q.includes('đại học')) {
        setTimeout(() => {
          appendMessage(`🎓 <b>HỌC LIÊN THÔNG</b><br><br>
          Sau khi tốt nghiệp Trung cấp, học sinh có thể học liên thông lên trình độ Cao đẳng, Đại học theo quy định hiện hành.`, 'bot');
        }, 300);
        return;
      }

      // 13. Câu hỏi: Cơ hội việc làm sau tốt nghiệp
      if (q.includes('việc làm') || q.includes('có việc') || q.includes('xin việc') || q.includes('ra trường')) {
        setTimeout(() => {
          appendMessage(`💼 <b>CƠ HỘI VIỆC LÀM</b><br><br>
          Nhà trường phối hợp chặt chẽ với các doanh nghiệp để giới thiệu việc làm cho học sinh sau khi tốt nghiệp.`, 'bot');
        }, 300);
        return;
      }

      // 14. Câu hỏi: Địa chỉ & Hotline tư vấn
      if (q.includes('địa chỉ') || q.includes('ở đâu') || q.includes('trường nằm') || q.includes('hotline') || q.includes('điện thoại') || q.includes('cô thuỷ')) {
        setTimeout(() => {
          appendMessage(`📍 <b>ĐỊA CHỈ & LIÊN HỆ NHÀ TRƯỜNG</b><br><br>
          🏫 <b>Địa chỉ:</b> Ấp Tô Hạ, Xã Tri Tôn, Tỉnh An Giang.<br><br>
          📞 <b>Hotline tư vấn tuyển sinh:</b> 0983 498 091 (Cô Thuỷ).`, 'bot');
        }, 300);
        return;
      }

      // Trả lời mặc định
      setTimeout(() => {
        appendMessage(`Cảm ơn bạn! Bạn có thể xem ngay <a href="https://heyzine.com/flip-book/cb1c57e308.html" target="_blank" class="text-indigo-600 underline font-semibold">Sổ tay các nghề</a> hoặc truy cập <a href="https://tuyensinh.dtntag.edu.vn/tuyen-sinh" target="_blank" class="text-indigo-600 underline font-semibold">Cổng Đăng Ký Online</a> nhé!`, 'bot');
      }, 300);
    }

    // Gửi form về Google Sheets
    window.handleLeadSubmit = async function(event) {
      event.preventDefault();

      const name = document.getElementById('lead-name').value.trim();
      const phone = document.getElementById('lead-phone').value.trim();
      const major = document.getElementById('lead-major').value;
      const submitBtn = event.target.querySelector('button[type="submit"]');

      submitBtn.disabled = true;
      submitBtn.innerText = 'Đang gửi...';

      const formData = new URLSearchParams();
      formData.append('name', name);
      formData.append('phone', phone);
      formData.append('major', major);

      try {
        await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: formData
        });

        event.target.innerHTML = `
          <div class="text-center py-2 text-emerald-600 font-medium text-xs">
            ✅ <b>Đã ghi nhận yêu cầu tư vấn!</b><br>
            Cán bộ tuyển sinh sẽ gọi qua SĐT <b>${phone}</b> sớm nhất.
          </div>
        `;
      } catch (error) {
        alert('Có lỗi kết nối, vui lòng thử lại!');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Gửi Thông Tin Hẹn Gọi';
      }
    };
  </script>
</body>
</html>
