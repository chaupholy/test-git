
<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chatbox Tuyển sinh</title>


<style>

/* =========================
   THIẾT LẬP CHUNG
========================= */

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


body {
    margin: 0;
    background: #f5f5f5;
}


/* =========================
   NÚT CHAT
========================= */

#nutChat {

    position: fixed;

    right: 25px;

    bottom: 25px;

    width: 65px;

    height: 65px;

    border: none;

    border-radius: 50%;

    background: #e91e63;

    color: white;

    font-size: 28px;

    cursor: pointer;

    box-shadow: 0 5px 20px rgba(0,0,0,0.3);

    z-index: 999;

}


/* =========================
   KHUNG CHAT
========================= */

#chatbox {

    display: none;

    position: fixed;

    right: 25px;

    bottom: 100px;

    width: 400px;

    max-width: calc(100% - 30px);

    height: 650px;

    background: white;

    border-radius: 18px;

    overflow: hidden;

    box-shadow: 0 10px 35px rgba(0,0,0,0.3);

    z-index: 1000;

}


/* =========================
   HEADER
========================= */

#chatHeader {

    background: #e91e63;

    color: white;

    padding: 16px;

    display: flex;

    justify-content: space-between;

    align-items: center;

}


#chatHeader h3 {

    margin: 0;

    font-size: 17px;

}


#dongChat {

    font-size: 22px;

    cursor: pointer;

}


/* =========================
   NỘI DUNG CHAT
========================= */

#noidung {

    height: 320px;

    overflow-y: auto;

    padding: 15px;

    background: #f5f5f5;

}


.bot {

    background: white;

    padding: 12px;

    border-radius: 12px;

    margin-bottom: 12px;

    max-width: 90%;

    line-height: 1.5;

    box-shadow: 0 2px 5px rgba(0,0,0,0.1);

}


.user {

    background: #e91e63;

    color: white;

    padding: 12px;

    border-radius: 12px;

    margin-bottom: 12px;

    margin-left: auto;

    max-width: 85%;

    line-height: 1.5;

}


/* =========================
   MENU
========================= */

#menu {

    height: 220px;

    overflow-y: auto;

    padding: 10px;

    border-top: 1px solid #eee;

}


#menu button {

    width: 48%;

    margin: 3px;

    padding: 9px 5px;

    border: none;

    border-radius: 10px;

    background: #fce4ec;

    color: #c2185b;

    cursor: pointer;

    font-size: 13px;

}


#menu button:hover {

    background: #e91e63;

    color: white;

}


/* =========================
   KHU VỰC NHẬP
========================= */

#nhap {

    display: flex;

    padding: 10px;

    border-top: 1px solid #ddd;

}


#cauhoi {

    flex: 1;

    padding: 10px;

    border: 1px solid #ddd;

    border-radius: 20px;

    outline: none;

}


#nutGui {

    margin-left: 5px;

    padding: 10px 15px;

    border: none;

    border-radius: 20px;

    background: #e91e63;

    color: white;

    cursor: pointer;

}


/* =========================
   ĐIỆN THOẠI
========================= */

@media(max-width:500px) {

    #chatbox {

        right: 15px;

        bottom: 90px;

        width: calc(100% - 30px);

        height: 600px;

    }


    #nutChat {

        right: 15px;

        bottom: 15px;

    }

}

</style>

</head>


<body>


<!-- =========================
     NÚT CHAT
========================= -->

<button id="nutChat" onclick="moChat()">

💬

</button>



<!-- =========================
     CHATBOX
========================= -->

<div id="chatbox">


    <!-- HEADER -->

    <div id="chatHeader">

        <h3>
        🎓 TƯ VẤN TUYỂN SINH
        </h3>


        <span id="dongChat" onclick="dongChat()">

        ✕

        </span>

    </div>



    <!-- =========================
         NỘI DUNG CHAT
    ========================= -->

    <div id="noidung">

        <div class="bot">

            👋 <b>Xin chào bạn!</b>

            <br><br>

            Tôi là trợ lý tư vấn tuyển sinh.

            <br><br>

            Tôi có thể hỗ trợ bạn tìm hiểu:

            <br>

            🎓 Ngành đào tạo

            <br>

            📝 Điều kiện tuyển sinh

            <br>

            💰 Miễn học phí

            <br>

            🏠 Ký túc xá

            <br>

            📄 Hồ sơ tuyển sinh

            <br>

            💼 Cơ hội việc làm

            <br><br>

            👇 Bạn hãy chọn một nội dung bên dưới hoặc nhập câu hỏi.

        </div>

    </div>



    <!-- =========================
         MENU
    ========================= -->

    <div id="menu">


        <button onclick="hoiNhanh('ngành đào tạo')">

        🎓 Ngành đào tạo

        </button>


        <button onclick="hoiNhanh('điều kiện tuyển sinh')">

        📝 Điều kiện

        </button>


        <button onclick="hoiNhanh('học phí')">

        💰 Học phí

        </button>


        <button onclick="hoiNhanh('ký túc xá')">

        🏠 Ký túc xá

        </button>


        <button onclick="hoiNhanh('chính sách hỗ trợ')">

        🎁 Chính sách

        </button>


        <button onclick="hoiNhanh('hồ sơ tuyển sinh')">

        📄 Hồ sơ

        </button>


        <button onclick="hoiNhanh('hình thức tuyển sinh')">

        📋 Xét tuyển

        </button>


        <button onclick="hoiNhanh('thời gian đào tạo')">

        ⏱️ Thời gian học

        </button>


        <button onclick="hoiNhanh('thực hành')">

        🔧 Thực hành

        </button>


        <button onclick="hoiNhanh('việc làm')">

        💼 Việc làm

        </button>


        <button onclick="hoiNhanh('liên thông')">

        🎓 Liên thông

        </button>


        <button onclick="hoiNhanh('nhận hồ sơ')">

        📅 Nhận hồ sơ

        </button>


        <button onclick="hoiNhanh('địa chỉ')">

        📍 Địa chỉ

        </button>


        <button onclick="hoiNhanh('liên hệ')">

        📞 Liên hệ

        </button>


        <button onclick="hoiNhanh('đăng ký tuyển sinh')">

        📝 Đăng ký ngay

        </button>


    </div>



    <!-- =========================
         NHẬP CÂU HỎI
    ========================= -->

    <div id="nhap">

        <input

        type="text"

        id="cauhoi"

        placeholder="Nhập câu hỏi..."

        onkeypress="kiemTraEnter(event)"

        >


        <button id="nutGui" onclick="guiTinNhan()">

        Gửi

        </button>


    </div>


</div>



<script>


/* =========================
   MỞ CHAT
========================= */

function moChat() {

    document.getElementById("chatbox").style.display = "block";

}



/* =========================
   ĐÓNG CHAT
========================= */

function dongChat() {

    document.getElementById("chatbox").style.display = "none";

}



/* =========================
   ENTER
========================= */

function kiemTraEnter(event) {

    if(event.key === "Enter") {

        guiTinNhan();

    }

}



/* =========================
   CÂU HỎI NHANH
========================= */

function hoiNhanh(noidung) {

    document.getElementById("cauhoi").value = noidung;

    guiTinNhan();

}



/* =========================
   HIỂN THỊ TIN NHẮN
========================= */

function themTinNhan(noidung, loai) {

    var khungChat =
    document.getElementById("noidung");


    khungChat.innerHTML +=

    '<div class="' + loai + '">' +

    noidung +

    '</div>';


    khungChat.scrollTop =
    khungChat.scrollHeight;

}



/* =========================
   GỬI TIN NHẮN
========================= */

function guiTinNhan() {


    var cauhoi =
    document.getElementById("cauhoi").value.trim();


    if(cauhoi === "") {

        return;

    }


    themTinNhan(cauhoi, "user");


    document.getElementById("cauhoi").value = "";


    var text =
    cauhoi.toLowerCase();


    var traLoi = "";


    /* =========================
       CHÀO
    ========================= */

    if(

        text.includes("xin chào") ||

        text === "chào" ||

        text.includes("hello") ||

        text.includes("hi")

    ) {

        traLoi =

        "👋 Xin chào bạn!<br><br>" +

        "Tôi là trợ lý tư vấn tuyển sinh của Trường.<br><br>" +

        "Bạn có thể hỏi về ngành học, điều kiện tuyển sinh, " +

        "học phí, ký túc xá hoặc hồ sơ.";

    }



    /* =========================
       GIỚI THIỆU TRƯỜNG
    ========================= */

    else if(

        text.includes("trường là gì") ||

        text.includes("giới thiệu trường") ||

        text.includes("về trường")

    ) {

        traLoi =

        "🏫 <b>GIỚI THIỆU NHÀ TRƯỜNG</b><br><br>" +

        "Trường là cơ sở giáo dục nghề nghiệp công lập của tỉnh An Giang.<br><br>" +

        "Nhà trường có nhiệm vụ đào tạo nghề cho học sinh, " +

        "đặc biệt là học sinh dân tộc thiểu số và học sinh vùng khó khăn.";

    }



    /* =========================
       TRÌNH ĐỘ ĐÀO TẠO
    ========================= */

    else if(

        text.includes("trình độ") ||

        text.includes("sơ cấp") ||

        text.includes("đào tạo thường xuyên")

    ) {

        traLoi =

        "📚 <b>CÁC TRÌNH ĐỘ ĐÀO TẠO</b><br><br>" +

        "🎓 Trung cấp<br>" +

        "📘 Sơ cấp<br>" +

        "📚 Đào tạo thường xuyên dưới 3 tháng.";

    }



    /* =========================
       HỎI TUYỂN SINH / LĨNH VỰC ĐÀO TẠO
    ========================= */

    else if(

        text.includes("hỏi tuyển sinh") ||

        text.includes("tuyển sinh") ||

        text.includes("lĩnh vực")

    ) {

        traLoi =

        "📢 <b>TƯ VẤN TUYỂN SINH</b><br><br>" +

        "Cảm ơn bạn đã quan tâm, hiện nay trường đang tuyển sinh rất nhiều ngành nghề. <b>Bạn muốn học lĩnh vực nào?</b><br><br>" +

        "<b>Các lĩnh vực/ngành nghề trường đang đào tạo:</b><br><br>" +

        "⚙️ <b>Khối Kỹ thuật & Cơ điện:</b><br>" +

        "• Công nghệ ô tô<br>" +

        "• Kỹ thuật máy lạnh & Điều hòa không khí<br>" +

        "• Điện công nghiệp<br>" +

        "• Cơ điện nông thôn<br><br>" +

        "💻 <b>Khối Công nghệ thông tin:</b><br>" +

        "• Tin học ứng dụng<br>" +

        "• Kỹ thuật sửa chữa, lắp ráp máy tính<br>" +

        "• Quản trị mạng máy tính<br>" +

        "• Thiết kế đồ họa<br>" +

        "• Tin học văn phòng<br><br>" +

        "📊 <b>Khối Kinh tế - Dịch vụ - Nghiệp vụ:</b><br>" +

        "• Thương mại điện tử<br>" +

        "• Kế toán doanh nghiệp<br>" +

        "• Hướng dẫn du lịch<br>" +

        "• Pháp luật<br><br>" +

        "🌱 <b>Khối Nông nghiệp:</b><br>" +

        "• Trồng trọt và bảo vệ thực vật";

    }



    /* =========================
       VIỆC LÀM KHỐI CNTT - MÁY TÍNH
    ========================= */

    else if(

        (text.includes("công nghệ thông tin") || text.includes("cntt") || text.includes("máy tính") || text.includes("tin học") || text.includes("đồ họa") || text.includes("quản trị mạng") || text.includes("lắp ráp máy tính")) &&

        (text.includes("việc làm") || text.includes("cơ hội") || text.includes("vị trí") || text.includes("ra trường làm") || text.includes("làm gì") || text.includes("xin việc") || text.includes("làm ở đâu"))

    ) {

        traLoi =

        "💼 <b>VỊ TRÍ VIỆC LÀM KHỐI CÔNG NGHỆ THÔNG TIN & MÁY TÍNH</b><br><br>" +

        "Sau khi tốt nghiệp các ngành CNTT tại trường, học sinh có cơ hội việc làm rộng mở:<br><br>" +

        "🖥️ <b>1. Kỹ thuật sửa chữa, lắp ráp máy tính:</b><br>" +

        "• Kỹ thuật viên bảo trì, lắp ráp, cài đặt hệ thống máy tính tại cơ quan, doanh nghiệp.<br>" +

        "• Nhân viên kỹ thuật phần cứng tại cửa hàng máy tính, siêu thị điện máy, trung tâm bảo hành.<br>" +

        "• Tự mở cửa hàng sửa chữa, kinh doanh máy tính, laptop.<br><br>" +

        "🌐 <b>2. Quản trị mạng máy tính:</b><br>" +

        "• Quản trị hệ thống mạng LAN/WAN, camera giám sát tại doanh nghiệp, trường học, bệnh viện.<br>" +

        "• Nhân viên IT Helpdesk hỗ trợ kỹ thuật người dùng.<br>" +

        "• Lắp đặt, bảo trì hạ tầng mạng cho các công ty viễn thông, công nghệ.<br><br>" +

        "🎨 <b>3. Thiết kế đồ họa:</b><br>" +

        "• Chuyên viên thiết kế banner, poster, ấn phẩm quảng cáo, bao bì tại xưởng in, công ty quảng cáo.<br>" +

        "• Nhân viên xử lý ảnh tại studio ảnh viện, công ty truyền thông - sự kiện.<br>" +

        "• Nhận dự án thiết kế tự do (Freelancer) hoặc thiết kế nội dung đồ họa bán hàng online.<br><br>" +

        "📊 <b>4. Tin học ứng dụng & Tin học văn phòng:</b><br>" +

        "• Nhân viên tin học, văn thư, nhập liệu và xử lý số liệu tại cơ quan, doanh nghiệp.<br>" +

        "• Quản trị hệ thống phần mềm nghiệp vụ, quản lý website đơn vị.<br><br>" +

        "🤝 <i>Nhà trường luôn phối hợp với các doanh nghiệp trên địa bàn để giới thiệu việc làm cho học sinh sau khi tốt nghiệp!</i>";

    }



    /* =========================
       CÁC NGÀNH CNTT - MÁY TÍNH
    ========================= */

    else if(

        text.includes("công nghệ thông tin") ||

        text.includes("cntt") ||

        text.includes("máy tính") ||

        text.includes("tin học") ||

        text.includes("đồ họa") ||

        text.includes("quản trị mạng") ||

        text.includes("lắp ráp máy tính")

    ) {

        traLoi =

        "💻 <b>CÁC NGÀNH CÔNG NGHỆ THÔNG TIN & MÁY TÍNH CỦA TRƯỜNG</b><br><br>" +

        "Trường hiện đang đào tạo các ngành, nghề thuộc khối <b>Công nghệ thông tin - Máy tính</b> bao gồm:<br><br>" +

        "1️⃣ <b>Kỹ thuật sửa chữa, lắp ráp máy tính:</b> Chẩn đoán, sửa chữa phần cứng, bảo trì và nâng cấp máy tính.<br>" +

        "2️⃣ <b>Quản trị mạng máy tính:</b> Lắp đặt, cấu hình và quản trị hệ thống mạng (LAN/WAN), camera quan sát.<br>" +

        "3️⃣ <b>Thiết kế đồ họa:</b> Thiết kế ấn phẩm, banner quảng cáo, xử lý hình ảnh truyền thông đa phương tiện.<br>" +

        "4️⃣ <b>Tin học ứng dụng:</b> Ứng dụng phần mềm công nghệ thông tin, quản trị dữ liệu và văn phòng số.<br>" +

        "5️⃣ <b>Tin học văn phòng:</b> Soạn thảo văn bản chuyên nghiệp, bảng tính thống kê dữ liệu.<br><br>" +

        "👉 Bấm vào liên kết Đào tạo trên Website trường để xem chi tiết chương trình học!";

    }



    /* =========================
       NGÀNH ĐÀO TẠO
    ========================= */

    else if(

        text.includes("ngành") ||

        text.includes("nghề") ||

        text.includes("học gì") ||

        text.includes("đào tạo")

    ) {

        traLoi =

        "🎓 <b>DANH SÁCH NGÀNH ĐÀO TẠO</b><br><br>" +

        "1️⃣ Công nghệ ô tô<br>" +

        "2️⃣ Kỹ thuật máy lạnh & Điều hòa không khí<br>" +

        "3️⃣ Cơ điện nông thôn<br>" +

        "4️⃣ Điện công nghiệp<br>" +

        "5️⃣ Trồng trọt và bảo vệ thực vật<br>" +

        "6️⃣ Bảo vệ thực vật<br>" +

        "7️⃣ Thương mại điện tử<br>" +

        "8️⃣ Pháp luật<br>" +

        "9️⃣ Tin học văn phòng<br>" +

        "🔟 Tin học ứng dụng<br>" +

        "1️⃣1️⃣ Kỹ thuật sửa chữa, lắp ráp máy tính<br>" +

        "1️⃣2️⃣ Quản trị mạng máy tính<br>" +

        "1️⃣3️⃣ Thiết kế đồ họa<br>" +

        "1️⃣4️⃣ Hướng dẫn du lịch<br>" +

        "1️⃣5️⃣ Kế toán doanh nghiệp";

    }



    /* =========================
       ĐIỀU KIỆN TUYỂN SINH
    ========================= */

    else if(

        text.includes("điều kiện") ||

        text.includes("lớp 9") ||

        text.includes("thcs") ||

        text.includes("tốt nghiệp") ||

        text.includes("được đăng ký")

    ) {

        traLoi =

        "📝 <b>ĐIỀU KIỆN TUYỂN SINH</b><br><br>" +

        "✅ Học sinh tốt nghiệp THCS trở lên có thể đăng ký học Trung cấp.<br><br>" +

        "Không phân biệt dân tộc hay địa phương.";

    }



    /* =========================
       THỜI GIAN ĐÀO TẠO
    ========================= */

    else if(

        text.includes("bao lâu") ||

        text.includes("mấy năm") ||

        text.includes("thời gian đào tạo") ||

        text.includes("thời gian học")

    ) {

        traLoi =

        "⏱️ <b>THỜI GIAN ĐÀO TẠO</b><br><br>" +

        "🎓 Thời gian đào tạo trình độ Trung cấp là <b>2 năm</b>.";

    }



    /* =========================
       THỰC HÀNH
    ========================= */

    else if(

        text.includes("thực hành") ||

        text.includes("thực tập") ||

        text.includes("xưởng")

    ) {

        traLoi =

        "🔧 <b>HỌC TẬP VÀ THỰC HÀNH</b><br><br>" +

        "Chương trình đào tạo chú trọng thực hành.<br><br>" +

        "Học sinh được học tập tại:<br>" +

        "🔧 Xưởng thực hành<br>" +

        "💻 Phòng máy<br>" +

        "🏫 Các khu vực thực hành nghề nghiệp.";

    }



    /* =========================
       HỌC PHÍ
    ========================= */

    else if(

        text.includes("học phí") ||

        text.includes("tiền học") ||

        text.includes("miễn học phí") ||

        text.includes("đóng tiền")

    ) {

        traLoi =

        "💰 <b>CHÍNH SÁCH HỌC PHÍ</b><br><br>" +

        "🎓 Học sinh tốt nghiệp THCS học Trung cấp được " +

        "<b>miễn hoàn toàn học phí</b> theo quy định của Nhà nước.";

    }



    /* =========================
       KÝ TÚC XÁ
    ========================= */

    else if(

        text.includes("ký túc xá") ||

        text.includes("ktx") ||

        text.includes("nội trú") ||

        text.includes("ở lại trường")

    ) {

        traLoi =

        "🏠 <b>KÝ TÚC XÁ - NỘI TRÚ</b><br><br>" +

        "Học sinh được bố trí ở <b>ký túc xá miễn phí</b>.<br><br>" +
