
<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chatbox Tuyển sinh</title>


<style>

/* =========================
   THIẾT LẬP CHUNG
========================= */

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


body {
    margin: 0;
    background: #f5f5f5;
}


/* =========================
   NÚT CHAT
========================= */

#nutChat {

    position: fixed;

    right: 25px;

    bottom: 25px;

    width: 65px;

    height: 65px;

    border: none;

    border-radius: 50%;

    background: #e91e63;

    color: white;

    font-size: 28px;

    cursor: pointer;

    box-shadow: 0 5px 20px rgba(0,0,0,0.3);

    z-index: 999;

}


/* =========================
   KHUNG CHAT
========================= */

#chatbox {

    display: none;

    position: fixed;

    right: 25px;

    bottom: 100px;

    width: 400px;

    max-width: calc(100% - 30px);

    height: 650px;

    background: white;

    border-radius: 18px;

    overflow: hidden;

    box-shadow: 0 10px 35px rgba(0,0,0,0.3);

    z-index: 1000;

}


/* =========================
   HEADER
========================= */

#chatHeader {

    background: #e91e63;

    color: white;

    padding: 16px;

    display: flex;

    justify-content: space-between;

    align-items: center;

}


#chatHeader h3 {

    margin: 0;

    font-size: 17px;

}


#dongChat {

    font-size: 22px;

    cursor: pointer;

}


/* =========================
   NỘI DUNG CHAT
========================= */

#noidung {

    height: 320px;

    overflow-y: auto;

    padding: 15px;

    background: #f5f5f5;

}


.bot {

    background: white;

    padding: 12px;

    border-radius: 12px;

    margin-bottom: 12px;

    max-width: 90%;

    line-height: 1.5;

    box-shadow: 0 2px 5px rgba(0,0,0,0.1);

}


.user {

    background: #e91e63;

    color: white;

    padding: 12px;

    border-radius: 12px;

    margin-bottom: 12px;

    margin-left: auto;

    max-width: 85%;

    line-height: 1.5;

}


/* =========================
   MENU
========================= */

#menu {

    height: 220px;

    overflow-y: auto;

    padding: 10px;

    border-top: 1px solid #eee;

}


#menu button {

    width: 48%;

    margin: 3px;

    padding: 9px 5px;

    border: none;

    border-radius: 10px;

    background: #fce4ec;

    color: #c2185b;

    cursor: pointer;

    font-size: 13px;

}


#menu button:hover {

    background: #e91e63;

    color: white;

}


/* =========================
   KHU VỰC NHẬP
========================= */

#nhap {

    display: flex;

    padding: 10px;

    border-top: 1px solid #ddd;

}


#cauhoi {

    flex: 1;

    padding: 10px;

    border: 1px solid #ddd;

    border-radius: 20px;

    outline: none;

}


#nutGui {

    margin-left: 5px;

    padding: 10px 15px;

    border: none;

    border-radius: 20px;

    background: #e91e63;

    color: white;

    cursor: pointer;

}


/* =========================
   ĐIỆN THOẠI
========================= */

@media(max-width:500px) {

    #chatbox {

        right: 15px;

        bottom: 90px;

        width: calc(100% - 30px);

        height: 600px;

    }


    #nutChat {

        right: 15px;

        bottom: 15px;

    }

}

</style>

</head>


<body>


<!-- =========================
     NÚT CHAT
========================= -->

<button id="nutChat" onclick="moChat()">

💬

</button>



<!-- =========================
     CHATBOX
========================= -->

<div id="chatbox">


    <!-- HEADER -->

    <div id="chatHeader">

        <h3>
        🎓 TƯ VẤN TUYỂN SINH
        </h3>


        <span id="dongChat" onclick="dongChat()">

        ✕

        </span>

    </div>



    <!-- =========================
         NỘI DUNG CHAT
    ========================= -->

    <div id="noidung">

        <div class="bot">

            👋 <b>Xin chào bạn!</b>

            <br><br>

            Tôi là trợ lý tư vấn tuyển sinh.

            <br><br>

            Tôi có thể hỗ trợ bạn tìm hiểu:

            <br>

            🎓 Ngành đào tạo

            <br>

            📝 Điều kiện tuyển sinh

            <br>

            💰 Miễn học phí

            <br>

            🏠 Ký túc xá

            <br>

            📄 Hồ sơ tuyển sinh

            <br>

            💼 Cơ hội việc làm

            <br><br>

            👇 Bạn hãy chọn một nội dung bên dưới hoặc nhập câu hỏi.

        </div>

    </div>



    <!-- =========================
         MENU
    ========================= -->

    <div id="menu">


        <button onclick="hoiNhanh('ngành đào tạo')">

        🎓 Ngành đào tạo

        </button>


        <button onclick="hoiNhanh('điều kiện tuyển sinh')">

        📝 Điều kiện

        </button>


        <button onclick="hoiNhanh('học phí')">

        💰 Học phí

        </button>


        <button onclick="hoiNhanh('ký túc xá')">

        🏠 Ký túc xá

        </button>


        <button onclick="hoiNhanh('chính sách hỗ trợ')">

        🎁 Chính sách

        </button>


        <button onclick="hoiNhanh('hồ sơ tuyển sinh')">

        📄 Hồ sơ

        </button>


        <button onclick="hoiNhanh('hình thức tuyển sinh')">

        📋 Xét tuyển

        </button>


        <button onclick="hoiNhanh('thời gian đào tạo')">

        ⏱️ Thời gian học

        </button>


        <button onclick="hoiNhanh('thực hành')">

        🔧 Thực hành

        </button>


        <button onclick="hoiNhanh('việc làm')">

        💼 Việc làm

        </button>


        <button onclick="hoiNhanh('liên thông')">

        🎓 Liên thông

        </button>


        <button onclick="hoiNhanh('nhận hồ sơ')">

        📅 Nhận hồ sơ

        </button>


        <button onclick="hoiNhanh('địa chỉ')">

        📍 Địa chỉ

        </button>


        <button onclick="hoiNhanh('liên hệ')">

        📞 Liên hệ

        </button>


        <button onclick="hoiNhanh('đăng ký tuyển sinh')">

        📝 Đăng ký ngay

        </button>


    </div>



    <!-- =========================
         NHẬP CÂU HỎI
    ========================= -->

    <div id="nhap">

        <input

        type="text"

        id="cauhoi"

        placeholder="Nhập câu hỏi..."

        onkeypress="kiemTraEnter(event)"

        >


        <button id="nutGui" onclick="guiTinNhan()">

        Gửi

        </button>


    </div>


</div>



<script>


/* =========================
   MỞ CHAT
========================= */

function moChat() {

    document.getElementById("chatbox").style.display = "block";

}



/* =========================
   ĐÓNG CHAT
========================= */

function dongChat() {

    document.getElementById("chatbox").style.display = "none";

}



/* =========================
   ENTER
========================= */

function kiemTraEnter(event) {

    if(event.key === "Enter") {

        guiTinNhan();

    }

}



/* =========================
   CÂU HỎI NHANH
========================= */

function hoiNhanh(noidung) {

    document.getElementById("cauhoi").value = noidung;

    guiTinNhan();

}



/* =========================
   HIỂN THỊ TIN NHẮN
========================= */

function themTinNhan(noidung, loai) {

    var khungChat =
    document.getElementById("noidung");


    khungChat.innerHTML +=

    '<div class="' + loai + '">' +

    noidung +

    '</div>';


    khungChat.scrollTop =
    khungChat.scrollHeight;

}



/* =========================
   GỬI TIN NHẮN
========================= */

function guiTinNhan() {


    var cauhoi =
    document.getElementById("cauhoi").value.trim();


    if(cauhoi === "") {

        return;

    }


    themTinNhan(cauhoi, "user");


    document.getElementById("cauhoi").value = "";


    var text =
    cauhoi.toLowerCase();


    var traLoi = "";


    /* =========================
       CHÀO
    ========================= */

    if(

        text.includes("xin chào") ||

        text === "chào" ||

        text.includes("hello") ||

        text.includes("hi")

    ) {

        traLoi =

        "👋 Xin chào bạn!<br><br>" +

        "Tôi là trợ lý tư vấn tuyển sinh của Trường.<br><br>" +

        "Bạn có thể hỏi về ngành học, điều kiện tuyển sinh, " +

        "học phí, ký túc xá hoặc hồ sơ.";

    }



    /* =========================
       GIỚI THIỆU TRƯỜNG
    ========================= */

    else if(

        text.includes("trường là gì") ||

        text.includes("giới thiệu trường") ||

        text.includes("về trường")

    ) {

        traLoi =

        "🏫 <b>GIỚI THIỆU NHÀ TRƯỜNG</b><br><br>" +

        "Trường là cơ sở giáo dục nghề nghiệp công lập của tỉnh An Giang.<br><br>" +

        "Nhà trường có nhiệm vụ đào tạo nghề cho học sinh, " +

        "đặc biệt là học sinh dân tộc thiểu số và học sinh vùng khó khăn.";

    }



    /* =========================
       TRÌNH ĐỘ ĐÀO TẠO
    ========================= */

    else if(

        text.includes("trình độ") ||

        text.includes("sơ cấp") ||

        text.includes("đào tạo thường xuyên")

    ) {

        traLoi =

        "📚 <b>CÁC TRÌNH ĐỘ ĐÀO TẠO</b><br><br>" +

        "🎓 Trung cấp<br>" +

        "📘 Sơ cấp<br>" +

        "📚 Đào tạo thường xuyên dưới 3 tháng.";

    }



    /* =========================
       HỎI TUYỂN SINH / LĨNH VỰC ĐÀO TẠO
    ========================= */

    else if(

        text.includes("hỏi tuyển sinh") ||

        text.includes("tuyển sinh") ||

        text.includes("lĩnh vực")

    ) {

        traLoi =

        "📢 <b>TƯ VẤN TUYỂN SINH</b><br><br>" +

        "Cảm ơn bạn đã quan tâm, hiện nay trường đang tuyển sinh rất nhiều ngành nghề. <b>Bạn muốn học lĩnh vực nào?</b><br><br>" +

        "<b>Các lĩnh vực/ngành nghề trường đang đào tạo:</b><br><br>" +

        "⚙️ <b>Khối Kỹ thuật & Cơ điện:</b><br>" +

        "• Công nghệ ô tô<br>" +

        "• Kỹ thuật máy lạnh & Điều hòa không khí<br>" +

        "• Điện công nghiệp<br>" +

        "• Cơ điện nông thôn<br><br>" +

        "💻 <b>Khối Công nghệ thông tin:</b><br>" +

        "• Tin học ứng dụng<br>" +

        "• Kỹ thuật sửa chữa, lắp ráp máy tính<br>" +

        "• Quản trị mạng máy tính<br>" +

        "• Thiết kế đồ họa<br>" +

        "• Tin học văn phòng<br><br>" +

        "📊 <b>Khối Kinh tế - Dịch vụ - Nghiệp vụ:</b><br>" +

        "• Thương mại điện tử<br>" +

        "• Kế toán doanh nghiệp<br>" +

        "• Hướng dẫn du lịch<br>" +

        "• Pháp luật<br><br>" +

        "🌱 <b>Khối Nông nghiệp:</b><br>" +

        "• Trồng trọt và bảo vệ thực vật";

    }



    /* =========================
       1. CÔNG NGHỆ Ô TÔ
    ========================= */
    else if(
        (text.includes("ô tô") || text.includes("oto")) &&
        !text.includes("số điện thoại") && !text.includes("học phí") && !text.includes("hồ sơ") && !text.includes("thời gian")
    ) {
        traLoi =
        "🚗 <b>NGÀNH CÔNG NGHỆ Ô TÔ</b><br><br>" +
        "• <b>Nội dung đào tạo:</b> Thực hành chuyên sâu về bảo dưỡng, chẩn đoán lỗi, sửa chữa động cơ xăng & diesel, hệ thống khung gầm, hệ thống truyền lực, hệ thống điện - điện tử ô tô hiện đại và điều hòa ô tô.<br><br>" +
        "• <b>Vị trí việc làm sau khi ra trường:</b><br>" +
        "- Kỹ thuật viên bảo dưỡng, sửa chữa ô tô tại các hãng xe lớn (Toyota, Hyundai, Ford, Kia...), garage tư nhân, trạm đăng kiểm.<br>" +
        "- Cố vấn dịch vụ kỹ thuật, nhân viên chăm sóc và làm đẹp ô tô (detailing).<br>" +
        "- Nhân viên kinh doanh phụ tùng, phụ kiện ô tô hoặc tự mở xưởng/garage ô tô.<br><br>" +
        "👉 Bấm vào mục Đào tạo trên Website trường để xem chi tiết chương trình học!";
    }

    /* =========================
       2. KỸ THUẬT MÁY LẠNH & ĐIỀU HÒA KHÔNG KHÍ
    ========================= */
    else if(
        (text.includes("máy lạnh") || text.includes("điều hòa") || text.includes("điện lạnh") || text.includes("nhiệt lạnh")) &&
        !text.includes("học phí") && !text.includes("hồ sơ") && !text.includes("thời gian")
    ) {
        traLoi =
        "❄️ <b>NGÀNH KỸ THUẬT MÁY LẠNH & ĐIỀU HÒA KHÔNG KHÍ (ĐIỆN LẠNH)</b><br><br>" +
        "• <b>Nội dung đào tạo:</b> Lắp đặt, vận hành, bảo dưỡng và sửa chữa máy lạnh dân dụng, tủ lạnh, máy giặt, điều hòa trung tâm (VRV, Chiller), hệ thống thông gió và kho lạnh công nghiệp.<br><br>" +
        "• <b>Vị trí việc làm sau khi ra trường:</b><br>" +
        "- Kỹ thuật viên lắp đặt, sửa chữa tại siêu thị điện máy (Điện Máy Xanh, Nguyễn Kim...), trung tâm bảo hành hãng (Daikin, Panasonic, LG...).<br>" +
        "- Kỹ thuật viên vận hành hệ thống thông gió, điều hòa không khí trung tâm (HVAC), kho lạnh tại tòa nhà cao ốc, khách sạn, xí nghiệp chế biến.<br>" +
        "- Tự mở cơ sở dịch vụ sửa chữa và bảo dưỡng điện lạnh dân dụng.<br><br>" +
        "👉 Bấm vào mục Đào tạo trên Website trường để xem chi tiết chương trình học!";
    }

    /* =========================
       3. ĐIỆN CÔNG NGHIỆP
    ========================= */
    else if(
        (text.includes("điện công nghiệp") || (text.includes("ngành điện") && !text.includes("điện lạnh") && !text.includes("cơ điện") && !text.includes("ô tô"))) &&
        !text.includes("số điện thoại") && !text.includes("học phí") && !text.includes("hồ sơ") && !text.includes("thời gian")
    ) {
        traLoi =
        "⚡ <b>NGÀNH ĐIỆN CÔNG NGHIỆP</b><br><br>" +
        "• <b>Nội dung đào tạo:</b> Lắp đặt, vận hành, bảo trì mạng hạ thế, tủ điện phân phối, tủ điều khiển công nghiệp, động cơ điện, biến tần, mạch tự động hóa và an toàn điện nhà xưởng.<br><br>" +
        "• <b>Vị trí việc làm sau khi ra trường:</b><br>" +
        "- Kỹ thuật viên bảo trì hệ thống điện, máy điện tại các khu công nghiệp, xí nghiệp, nhà máy sản xuất.<br>" +
        "- Thợ điện thi công lắp đặt hệ thống điện công trình, dân dụng và công nghiệp.<br>" +
        "- Nhân viên kỹ thuật vận hành trạm biến áp, tòa nhà, resort, khách sạn.<br>" +
        "- Tự nhận thầu thi công điện nước dân dụng và công nghiệp.<br><br>" +
        "👉 Bấm vào mục Đào tạo trên Website trường để xem chi tiết chương trình học!";
    }

    /* =========================
       4. CƠ ĐIỆN NÔNG THÔN
    ========================= */
    else if(
        (text.includes("cơ điện") || text.includes("máy nông nghiệp")) &&
        !text.includes("học phí") && !text.includes("hồ sơ") && !text.includes("thời gian")
    ) {
        traLoi =
        "🚜 <b>NGÀNH CƠ ĐIỆN NÔNG THÔN</b><br><br>" +
        "• <b>Nội dung đào tạo:</b> Lắp đặt, vận hành, bảo dưỡng, sửa chữa máy cơ khí nông nghiệp (máy cày, máy gặt đập liên hợp, máy xới đất, máy bơm nước); kỹ thuật hàn điện, hàn hơi, gia công cơ khí; hệ thống tưới tiêu tự động.<br><br>" +
        "• <b>Vị trí việc làm sau khi ra trường:</b><br>" +
        "- Thợ kỹ thuật sửa chữa máy móc nông nghiệp tại các hợp tác xã, trạm cơ giới hóa nông nghiệp.<br>" +
        "- Kỹ thuật viên bảo trì máy tại các trang trại nông nghiệp công nghệ cao, nhà máy xay xát, chế biến lúa gạo, nông sản.<br>" +
        "- Tự mở xưởng sửa chữa máy móc cơ điện và gia công cơ khí nông thôn.<br><br>" +
        "👉 Bấm vào mục Đào tạo trên Website trường để xem chi tiết chương trình học!";
    }

    /* =========================
       5. KỸ THUẬT SỬA CHỮA, LẮP RÁP MÁY TÍNH
    ========================= */
    else if(
        (text.includes("lắp ráp máy tính") || text.includes("sửa chữa máy tính") || text.includes("sửa laptop") || (text.includes("phần cứng") && text.includes("máy tính"))) &&
        !text.includes("học phí") && !text.includes("hồ sơ") && !text.includes("thời gian")
    ) {
        traLoi =
        "🖥️ <b>NGÀNH KỸ THUẬT SỬA CHỮA, LẮP RÁP MÁY TÍNH</b><br><br>" +
        "• <b>Nội dung đào tạo:</b> Tháo lắp, thay thế và sửa chữa linh kiện phần cứng (mainboard, CPU, RAM, ổ cứng, nguồn...); cài đặt hệ điều hành, phần mềm ứng dụng; chẩn đoán và khắc phục sự cố máy tính, laptop, thiết bị ngoại vi (máy in, máy scan).<br><br>" +
        "• <b>Vị trí việc làm sau khi ra trường:</b><br>" +
        "- Kỹ thuật viên bảo trì, sửa chữa máy tính tại các công ty tin học, chuỗi siêu thị công nghệ (FPT Shop, Thế Giới Di Động...), trung tâm bảo hành.<br>" +
        "- Kỹ thuật viên IT Helpdesk hỗ trợ kỹ thuật máy tính tại các cơ quan, trường học, doanh nghiệp.<br>" +
        "- Tự mở cửa hàng kinh doanh, sửa chữa máy tính, laptop và thiết bị văn phòng.<br><br>" +
        "👉 Bấm vào mục Đào tạo trên Website trường để xem chi tiết chương trình học!";
    }

    /* =========================
       6. QUẢN TRỊ MẠNG MÁY TÍNH
    ========================= */
    else if(
        (text.includes("quản trị mạng") || text.includes("mạng máy tính") || text.includes("mạng lan")) &&
        !text.includes("học phí") && !text.includes("hồ sơ") && !text.includes("thời gian")
    ) {
        traLoi =
        "🌐 <b>NGÀNH QUẢN TRỊ MẠNG MÁY TÍNH</b><br><br>" +
